<!doctype html>
<!-- Hidden copies of every website form so Netlify Forms registers them at deploy time. Field names must match src/components/Form.jsx. -->
<html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Forms</title></head><body>
<form name="contact" data-netlify="true" netlify-honeypot="website" hidden>
  <input type="hidden" name="form-name" value="contact" />
  <input type="hidden" name="form_kind" value="contact" />
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="text" name="category" />
  <textarea name="message"></textarea>
  <input type="checkbox" name="consent" value="yes" />
  <input name="website" />
</form>

  <input type="text" name="name" />
  <input type="email" name="email" />
  <textarea name="message"></textarea>
  <input type="checkbox" name="consent" value="yes" />
  <input name="website" />
</form>
